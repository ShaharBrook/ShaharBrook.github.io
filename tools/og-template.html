<!doctype html>
<!-- ==========================================================================
     Open Graph image template — 1200×630.

     This is a generator, not part of the published site. It renders to
     assets/img/og.png, which is what WhatsApp, LinkedIn and Slack show when
     someone shares your link.

     REGENERATE after editing:
       node tools/og-render.mjs

     Colours are copied from the dark-mode tokens in assets/css/styles.css.
     If you change --accent there, change it here too.
     ========================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #3ddc9a;
    --bg:     #0c1116;
    --ink:    #eef2f6;
    --ink-2:  #b6c1cc;
    --ink-3:  #8b98a5;
    --line:   #232e39;
  }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  /* Same accent wash as the hero, so the preview and the page feel like one thing. */
  body::before {
    content: "";
    position: absolute;
    inset: -35% -10% auto -12%;
    height: 620px;
    background:
      radial-gradient(46rem 26rem at 20% 25%, rgba(61,220,154,0.16), transparent 68%),
      radial-gradient(32rem 20rem at 84% 6%,  rgba(61,220,154,0.10), transparent 70%);
  }

  .row { position: relative; display: flex; align-items: center; gap: 14px; }

  .mark {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: var(--accent);
    box-shadow: 0 0 0 7px rgba(61,220,154,0.14);
  }

  .name { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }

  h1 {
    position: relative;
    font-size: 86px;
    line-height: 1.08;
    letter-spacing: -0.035em;
    font-weight: 700;
  }
  h1 .accent { color: var(--accent); display: block; }

  .foot {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    padding-top: 30px;
    border-top: 1px solid var(--line);
    font-size: 25px;
    color: var(--ink-3);
    letter-spacing: -0.01em;
  }
  .foot .sep { color: var(--line); }
  .foot .url { color: var(--ink-2); font-weight: 600; }
</style>
</head>
<body>

  <div class="row">
    <span class="mark"></span>
    <span class="name">Shahar&nbsp;Brook</span>
  </div>

  <!-- Keep this to two lines. Three lines at this size overflows the card. -->
  <h1>
    Ship AI-generated code
    <span class="accent">without shipping the risk.</span>
  </h1>

  <div class="foot">
    <span class="url">shaharbrook.github.io</span>
    <span class="sep">·</span>
    <span>Code review · Security · Guardrails · CRMs &amp; sites</span>
  </div>

</body>
</html>
